<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="'Segoe UI', Arial, Helvetica, sans-serif"><defs><marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a_slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a_dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1000" height="470" fill="#ffffff"/><rect x="20" y="20" width="960" height="432" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6"/><rect x="20" y="20" width="960" height="64" rx="14" fill="#4a1942"/><rect x="20" y="60" width="960" height="24" fill="#4a1942"/><text x="44" y="50" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Task: Smart Electricity Bill Calculator</tspan></text><text x="44" y="73" font-size="13.5" fill="#f1d5ec" font-weight="normal" text-anchor="start"><tspan x="44" dy="0">File: smart_electricity_bill.py   |   Topic: for loop, range(), accumulators, conditions</tspan></text><rect x="44" y="102" width="218" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="153" y="130" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle"><tspan x="153" dy="0">Input</tspan></text><text x="60" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">Number of households</tspan></text><text x="60" y="178" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">Units used by each</tspan></text><text x="60" y="202" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">household (whole numbers)</tspan></text><text x="60" y="226" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="60" dy="0">One prompt per household</tspan></text><rect x="273" y="102" width="218" height="200" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="382" y="130" font-size="16" fill="#7c3aed" font-weight="700" text-anchor="middle"><tspan x="382" dy="0">Rules</tspan></text><text x="289" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Households must be &gt; 0</tspan></text><text x="289" y="178" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Units must be &gt;= 0</tspan></text><text x="289" y="202" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">1-100 units: Rs. 10 per unit</tspan></text><text x="289" y="226" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">101-200 units: Rs. 15 per unit</tspan></text><text x="289" y="250" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Above 200: Rs. 20 per unit</tspan></text><text x="289" y="274" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="289" dy="0">Invalid household is skipped</tspan></text><rect x="502" y="102" width="218" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="611" y="130" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle"><tspan x="611" dy="0">Output</tspan></text><text x="518" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Units and bill per household</tspan></text><text x="518" y="178" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Total and valid households</tspan></text><text x="518" y="202" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Total revenue</tspan></text><text x="518" y="226" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Average bill (2 decimals)</tspan></text><text x="518" y="250" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="518" dy="0">Highest bill and its household</tspan></text><rect x="731" y="102" width="218" height="200" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="840" y="130" font-size="16" fill="#92400e" font-weight="700" text-anchor="middle"><tspan x="840" dy="0">Concepts</tspan></text><text x="747" y="154" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">for loop with range()</tspan></text><text x="747" y="178" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">accumulators (+=)</tspan></text><text x="747" y="202" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">if / elif / else tiers</tspan></text><text x="747" y="226" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">continue statement</tspan></text><text x="747" y="250" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">try / except / else</tspan></text><text x="747" y="274" font-size="12.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="747" dy="0">f-strings</tspan></text><text x="44" y="332" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="44" dy="0">Progressive tiers (each rate applies only to the units inside its tier)</tspan></text><rect x="44" y="346" width="290" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="189.0" y="372.55" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="189.0" dy="0">Units 1 - 100:  Rs. 10 per unit</tspan></text><rect x="350" y="346" width="290" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="495.0" y="372.55" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="495.0" dy="0">Units 101 - 200:  Rs. 15 per unit</tspan></text><rect x="656" y="346" width="290" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="801.0" y="372.55" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="801.0" dy="0">Units above 200:  Rs. 20 per unit</tspan></text><text x="44" y="416" font-size="13" fill="#334155" font-weight="normal" text-anchor="start"><tspan x="44" dy="0">Example: 250 units = 100 x 10 + 100 x 15 + 50 x 20 = Rs. 3500</tspan></text><text x="44" y="438" font-size="12.5" fill="#475569" font-weight="normal" text-anchor="start"><tspan x="44" dy="0">No functions: one script, so the program runs top to bottom and ends after the report.</tspan></text></svg>