<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" font-family="'Segoe UI', Arial, Helvetica, sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1a24"/><stop offset="0.5" stop-color="#5b1a52"/><stop offset="1" stop-color="#c2257e"/></linearGradient><clipPath id="cp"><rect width="1000" height="260" rx="14"/></clipPath></defs><g clip-path="url(#cp)"><rect width="1000" height="260" fill="url(#bg)"/><circle cx="850" cy="104" r="96" fill="#ffffff" fill-opacity="0.09"/><circle cx="850" cy="104" r="66" fill="#ffffff" fill-opacity="0.09"/></g><text x="40" y="66" font-size="40" fill="#ffffff" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Smart Electricity</tspan></text><text x="40" y="110" font-size="40" fill="#ffd60a" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Bill Calculator</tspan></text><text x="40" y="140" font-size="16" fill="#f1d5ec" font-weight="normal" text-anchor="start"><tspan x="40" dy="0">Tiered billing for many households with a for loop</tspan></text><rect x="40" y="154" width="76" height="28" rx="14" fill="#ffd60a"/><text x="78.0" y="173" font-size="13" fill="#1f1a24" font-weight="700" text-anchor="middle"><tspan x="78.0" dy="0">for loop</tspan></text><rect x="126" y="154" width="76" height="28" rx="14" fill="#ffd60a"/><text x="164.0" y="173" font-size="13" fill="#1f1a24" font-weight="700" text-anchor="middle"><tspan x="164.0" dy="0">range()</tspan></text><rect x="212" y="154" width="104" height="28" rx="14" fill="#ffd60a"/><text x="264.0" y="173" font-size="13" fill="#1f1a24" font-weight="700" text-anchor="middle"><tspan x="264.0" dy="0">accumulator</tspan></text><rect x="326" y="154" width="118" height="28" rx="14" fill="#ffd60a"/><text x="385.0" y="173" font-size="13" fill="#1f1a24" font-weight="700" text-anchor="middle"><tspan x="385.0" dy="0">if / elif / else</tspan></text><rect x="454" y="154" width="80" height="28" rx="14" fill="#ffd60a"/><text x="494.0" y="173" font-size="13" fill="#1f1a24" font-weight="700" text-anchor="middle"><tspan x="494.0" dy="0">continue</tspan></text><rect x="590" y="30" width="130" height="44" rx="10" fill="#1f1a24" fill-opacity="0.55" stroke="#ffd60a" stroke-opacity="0.7"/><text x="606" y="49" font-size="16" fill="#ffd60a" font-weight="700" text-anchor="start"><tspan x="606" dy="0">Rs. 10</tspan></text><text x="606" y="65" font-size="11.5" fill="#f1d5ec" font-weight="normal" text-anchor="start"><tspan x="606" dy="0">units 1-100</tspan></text><rect x="690" y="44" width="16" height="0" fill="none"/><rect x="590" y="84" width="130" height="44" rx="10" fill="#1f1a24" fill-opacity="0.55" stroke="#ffd60a" stroke-opacity="0.7"/><text x="606" y="103" font-size="16" fill="#ffd60a" font-weight="700" text-anchor="start"><tspan x="606" dy="0">Rs. 15</tspan></text><text x="606" y="119" font-size="11.5" fill="#f1d5ec" font-weight="normal" text-anchor="start"><tspan x="606" dy="0">units 101-200</tspan></text><rect x="690" y="98" width="16" height="0" fill="none"/><rect x="590" y="138" width="130" height="44" rx="10" fill="#1f1a24" fill-opacity="0.55" stroke="#ffd60a" stroke-opacity="0.7"/><text x="606" y="157" font-size="16" fill="#ffd60a" font-weight="700" text-anchor="start"><tspan x="606" dy="0">Rs. 20</tspan></text><text x="606" y="173" font-size="11.5" fill="#f1d5ec" font-weight="normal" text-anchor="start"><tspan x="606" dy="0">units 201+</tspan></text><rect x="690" y="152" width="16" height="0" fill="none"/><path d="M868,22 L792,124 L836,124 L812,194 L906,82 L858,82 L886,22 Z" fill="#ffd60a"/><rect x="24" y="204" width="952" height="40" rx="10" fill="#120e16" fill-opacity="0.9"/><text y="229" font-size="15" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan x="44"><tspan fill="#a58ba3"># tier 3   </tspan><tspan fill="#f5eef6">bill</tspan><tspan fill="#ff7ac6"> = </tspan><tspan fill="#f5eef6">(</tspan><tspan fill="#ffd60a">100</tspan><tspan fill="#ff7ac6"> * </tspan><tspan fill="#ffd60a">10</tspan><tspan fill="#f5eef6">) + (</tspan><tspan fill="#ffd60a">100</tspan><tspan fill="#ff7ac6"> * </tspan><tspan fill="#ffd60a">15</tspan><tspan fill="#f5eef6">) + ((</tspan><tspan fill="#f5eef6">units</tspan><tspan fill="#ff7ac6"> - </tspan><tspan fill="#ffd60a">200</tspan><tspan fill="#ff7ac6">) * </tspan><tspan fill="#ffd60a">20</tspan><tspan fill="#f5eef6">)</tspan></tspan></text></svg>