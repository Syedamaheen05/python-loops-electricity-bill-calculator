"start"><tspan x="48" dy="0">Success output</tspan></text><rect x="20" y="90" width="20" height="14" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="48" y="101.5" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Error, program stops</tspan></text><rect x="20" y="114" width="20" height="14" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="48" y="125.5" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Warning, household skipped</tspan></text><rect x="20" y="138" width="20" height="14" rx="4" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="48" y="149.5" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start"><tspan x="48" dy="0">Process</tspan></text><rect x="430" y="14" width="140" height="30" rx="15" fill="#0f172a"/><text x="500" y="34" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="500" dy="0">Start</tspan></text><path d="M500,44 L500,64" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><rect x="380" y="64" width="240" height="34" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="500.0" y="85.2" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="500.0" dy="0">Print title banner</tspan></text><path d="M500,98 L500,118" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><rect x="380" y="118" width="240" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="500.0" y="142.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500.0" dy="0">Input: number of households</tspan></text><path d="M500,158 L500,172" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><polygon points="500,172 595,206 500,240 405,206" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="500" y="210.2" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">int() works?</tspan></text><path d="M595,206 L640,206" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a_red)"/><text x="600" y="198" font-size="11" fill="#dc2626" font-weight="700" text-anchor="start"><tspan x="600" dy="0">No</tspan></text><rect x="640" y="186" width="230" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="755.0" y="202.8375" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="755.0" dy="0">Invalid input! Enter a</tspan><tspan x="755.0" dy="14.375">whole number.</tspan></text><path d="M755,226 L755,246" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a_red)"/><rect x="715" y="246" width="80" height="28" rx="14" fill="#0f172a"/><text x="755" y="265" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle"><tspan x="755" dy="0">End</tspan></text><path d="M500,240 L500,284" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><text x="506" y="262" font-size="11" fill="#16a34a" font-weight="700" text-anchor="start"><tspan x="506" dy="0">Yes</tspan></text><polygon points="500,284 595,318 500,352 405,318" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="500" y="322.2" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">households &gt; 0?</tspan></text><path d="M595,318 L640,318" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#a_red)"/><text x="600" y="310" font-size="11" fill="#dc2626" font-weight="700" text-anchor="start"><tspan x="600" dy="0">No</tspan></text><rect x="640" y="298" width="230" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="755.0" y="314.8375" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="755.0" dy="0">Number of households must</tspan><tspan x="755.0" dy="14.375">be greater than zero.</tspan></text><path d=