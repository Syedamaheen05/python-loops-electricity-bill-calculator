width="1.6"/><text x="500.0" y="622.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500.0" dy="0">Input: units consumed</tspan></text><path d="M500,638 L500,654" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><polygon points="500,654 595,690 500,726 405,690" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="500" y="694.2" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">int() works?</tspan></text><path d="M405,690 L270,690" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a_amber)"/><text x="400" y="682" font-size="11" fill="#d97706" font-weight="700" text-anchor="end"><tspan x="400" dy="0">No</tspan></text><rect x="60" y="668" width="210" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="165.0" y="686.8375" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="165.0" dy="0">Invalid input! Enter a whole</tspan><tspan x="165.0" dy="14.375">number. continue</tspan></text><path d="M60,690 L30,690" fill="none" stroke="#475569" stroke-width="1.6"/><path d="M500,726 L500,742" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><text x="506" y="738" font-size="11" fill="#16a34a" font-weight="700" text-anchor="start"><tspan x="506" dy="0">Yes</tspan></text><polygon points="500,742 595,776 500,810 405,776" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="500" y="780.2" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">units &lt; 0?</tspan></text><path d="M405,776 L270,776" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a_amber)"/><text x="400" y="768" font-size="11" fill="#d97706" font-weight="700" text-anchor="end"><tspan x="400" dy="0">Yes</tspan></text><rect x="60" y="754" width="210" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="165.0" y="772.8375" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="165.0" dy="0">Invalid units! Enter a</tspan><tspan x="165.0" dy="14.375">non-negative value. continue</tspan></text><path d="M60,776 L30,776" fill="none" stroke="#475569" stroke-width="1.6"/><path d="M500,810 L500,834" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><text x="506" y="826" font-size="11" fill="#475569" font-weight="700" text-anchor="start"><tspan x="506" dy="0">No</tspan></text><polygon points="500,834 600,872 500,910 400,872" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="500" y="868.7" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">Which tier?</tspan><tspan x="500" dy="15.0">if / elif / else</tspan></text><path d="M500,910 L500,930" fill="none" stroke="#0f172a" stroke-width="1.6"/><path d="M265,930 L735,930" fill="none" stroke="#0f172a" stroke-width="1.6"/><path d="M265,930 L265,946" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><rect x="153" y="946" width="224" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="265.0" y="968.1125" font-size="10.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="265.0" dy="0">units &lt;= 100:</tspan><tspan x="265.0" dy="13.125">bill = units * 10</tspan></text><path d="M265,996 L265,1012" fill="none" stroke="#0f172a" stroke-width="1.6"/><path d="M500,930 L500,946" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><rect x="388" y="946" width="224" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="500.0" y="968.1125" font-size="10.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="500.0" dy="0">units &lt;= 200:</tspan><tspan x="500.0" dy="13.125">bill = (100*10) + ((units-100)*15)</tspan></text><path d="M500,996 L500,1012" fill="none" stroke="#0f172a" stroke-width="1.6"/><path d="M735,930 L735,946" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><rect x="623" y="946" width="224" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="735.0" y="968.1125" font-size="10.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="735.0" dy="0">else:</tspan><tspan x="735.0" dy="13.125">bill = (100*10)+(100*15)+((units-200)*20)</tspan></text><path d="M735,996 L735,1012" fill="none" stroke="#0f172a" stroke-width="1.6"/><path d="M265,1012 L735,1012" fill="none" stroke="#0f172a" stroke-width="1.6"/><path d="M500,1012 L500,1030" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><rect x="370" y="1030" width="260" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="500.0" y="1047.7" font-size="12" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="500.0" dy="0">Print: Units Consumed,</tspan><tspan x="500.0" dy="15.0">Electricity Bill</tspan></text><path d="M500,1072 L500,1090" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><rect x="370" y="1090" width="260" height="58" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="500.0" y="1109.1" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="500.0" dy="0">total_revenue += bill</tspan><tspan x="500.0" dy="13.75">valid_households += 1</tspan><tspan x="500.0" dy="13.75">update highest_bill / highest_household</tspan></text><path d="M370,1119 L30,1119 L30,480 L388,480" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a_slate)"/><circle cx="30" cy="690" r="3" fill="#475569"/><circle cx="30" cy="776" r="3" fill="#475569"/><text x="40" y="1108" font-size="11" fill="#475569" font-weight="600" text-anchor="start"><tspan x="40" dy="0">next household</tspan></text><path d="M612,480 L970,480 L970,1236 L630,1236" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a_slate)"/><text x="618" y="472" font-size="11" fill="#475569" font-weight="700" text-anchor="start"><tspan x="618" dy="0">No, loop finished</tspan></text><rect x="370" y="1210" width="260" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="500.0" y="1232.975" font-size="11" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="500.0" dy="0">Print MONTHLY REVENUE REPORT:</tspan><tspan x="500.0" dy="13.75">total, valid households, total revenue</tspan></text><path d="M500,1262 L500,1296" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><polygon points="500,1296 605,1330 500,1364 395,1330" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="500" y="1334.025" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">valid_households &gt; 0?</tspan></text><path d="M500,1364 L500,1394" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a_green)"/><text x="506" y="1382" font-size="11" fill="#16a34a" font-weight="700" text-anchor="start"><tspan x="506" dy="0">Yes</tspan></text><rect x="360" y="1394" width="280" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="500.0" y="1416.8375" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="500.0" dy="0">Print average bill, highest bill,</tspan><tspan x="500.0" dy="14.375">household with highest bill</tspan></text><path d="M500,1446 L500,1470" fill="none" stroke="#0f172a" stroke-width="1.6" marker-end="url(#a_dark)"/><path d="M395,1330 L320,1330" fill="none" stroke="#d97706" stroke-width="1.6" marker-end="url(#a_amber)"/><text x="390" y="1322" font-size="11" fill="#d97706" font-weight="700" text-anchor="end"><tspan x="390" dy="0">No</tspan></text><rect x="100" y="1308" width="220" height="44" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="210.0" y="1326.8375" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="middle"><tspan x="210.0" dy="0">No valid household bills</