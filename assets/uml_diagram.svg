<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'Segoe UI', Arial, Helvetica, sans-serif"><defs><marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a_purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a_amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a_slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a_dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker></defs><rect width="1000" height="520" fill="#ffffff"/><text x="500" y="26" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle"><tspan x="500" dy="0">Module diagram: smart_electricity_bill.py (one script, no classes)</tspan></text><rect x="30" y="46" width="560" height="440" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.8"/><rect x="30" y="46" width="560" height="34" rx="10" fill="#4a1942"/><rect x="30" y="64" width="560" height="16" fill="#4a1942"/><text x="44" y="69" font-size="14" fill="#ffffff" font-weight="700" text-anchor="start"><tspan x="44" dy="0">«module»  smart_electricity_bill.py</tspan></text><rect x="46" y="94" width="528" height="104" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/><text x="60" y="114" font-size="13" fill="#92400e" font-weight="700" text-anchor="start"><tspan x="60" dy="0">Variables</tspan></text><text x="60" y="134" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="60" dy="0">households (int)  number of households entered</tspan></text><text x="60" y="151" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="60" dy="0">total_revenue = 0, valid_households = 0  (accumulators)</tspan></text><text x="60" y="168" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="60" dy="0">highest_bill = 0, highest_household = 0</tspan></text><text x="60" y="185" font-size="11.5" fill="#0f172a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace"><tspan x="60" dy="0">household (loop variable), units, bill, average_bill</tspan></text><rect x="46" y="212" width="528" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="310.0" y="238.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="310.0" dy="0">1. Read household count: try / except / else</tspan></text><rect x="46" y="264" width="528" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="310.0" y="290.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="310.0" dy="0">2. Validate: households &lt;= 0 stops the program</tspan></text><rect x="46" y="316" width="528" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="310.0" y="342.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="310.0" dy="0">3. for household in range(1, households + 1)</tspan></text><rect x="46" y="368" width="528" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="310.0" y="394.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="310.0" dy="0">4. Bill tiers: if / elif / else, then accumulate</tspan></text><rect x="46" y="420" width="528" height="44" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="310.0" y="446.375" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="310.0" dy="0">5. Monthly report: totals, average, highest</tspan></text><rect x="740" y="74" width="200" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="840.0" y="94.5625" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="840.0" dy="0">«builtin»</tspan><tspan x="840.0" dy="15.625">input()</tspan></text><rect x="740" y="146" width="200" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="840.0" y="166.5625" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="840.0" dy="0">«builtin»</tspan><tspan x="840.0" dy="15.625">int()</tspan></text><rect x="740" y="250" width="200" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="840.0" y="270.5625" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="840.0" dy="0">«builtin»</tspan><tspan x="840.0" dy="15.625">range()</tspan></text><rect x="740" y="384" width="200" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="840.0" y="404.5625" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle"><tspan x="840.0" dy="0">«builtin»</tspan><tspan x="840.0" dy="15.625">print()</tspan></text><text x="840" y="56" font-size="12.5" fill="#475569" font-weight="700" text-anchor="middle"><tspan x="840" dy="0">Python built-in functions</tspan></text><path d="M574,226 L740,98" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><path d="M574,242 L740,170" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><path d="M574,328 L740,274" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><path d="M574,338 L740,98" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><path d="M574,348 L740,170" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><path d="M574,442 L740,408" fill="none" stroke="#0f172a" stroke-width="1.3" marker-end="url(#a_dark)"/><text x="660" y="236" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle"><tspan x="660" dy="0">«calls»</tspan></text><text x="840" y="456" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="middle"><tspan x="840" dy="0">print() is used in every section</tspan></text><text x="30" y="508" font-size="11.5" fill="#475569" font-weight="normal" text-anchor="start"><tspan x="30" dy="0">Solid arrows show which built-ins each section calls. The script has no custom functions.</tspan></text></svg>